<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frank Le — Filmmaker &amp; Designer</title>
<meta name="description" content="Lê Vũ Xuân Anh (Frank Le) — filmmaker and designer. Director, screenwriter, editor, and UI/UX designer.">
<meta property="og:title" content="Frank Le — Filmmaker &amp; Designer">
<meta property="og:description" content="Lê Vũ Xuân Anh (Frank Le) — filmmaker and designer based in Waterloo, Ontario.">
<meta property="og:type" content="website">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
<script>try{var t=localStorage.getItem('theme');if(t==='dark'||t==='light')document.documentElement.dataset.theme=t;}catch(e){}</script>
</head>
<body data-nav-current="home" class="page-canvas">

<a class="skip-link" href="#main">Skip to content</a>

<main id="main" class="canvas" data-node-canvas>
  <!-- Everything that pans and zooms lives inside .canvas__world.
       The canvas itself is the fixed viewport; the world is the sheet
       of paper moving behind it. Corner marks stay outside, so they
       hold still while the paper moves. -->
  <div class="canvas__world">
    <svg class="canvas__edges" aria-hidden="true"></svg>
    <div class="canvas__nodes"></div>
  </div>

  <!-- Points back to the root when the view has wandered off it. It
       sits outside .canvas__world, in the canvas's own pixels, so it
       stays pinned to the edge of the screen rather than to the
       paper. js/node-tree.js places and rotates it. -->
  <button class="compass" type="button"
          aria-label="Back to Lê Vũ Xuân Anh">
    <span class="compass__arrow" aria-hidden="true">&rarr;</span>
  </button>

  <!-- The tree is the whole menu, so with JS off there has to be a
       real set of links here or the site is a dead end. -->
  <noscript>
    <ul class="canvas__fallback">
      <li><a href="about.html">About</a></li>
      <li><a href="works.html">Works</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </noscript>
</main>

<div class="canvas__marks">
  <!-- The name, the bio and the role line all live on the canvas now:
       the root node says the name, the bio is a node that branches to
       About, and the roles are the root's caption. See js/node-tree.js. -->
  <div class="mark mark--view" hidden>
    <button class="theme__btn" type="button" data-reset-view>Reset view</button>
  </div>

  <div class="mark mark--theme">
    <div class="theme" role="group" aria-label="Colour mode">
      <button class="theme__btn" type="button" data-set-theme="light">Light</button>
      <button class="theme__btn" type="button" data-set-theme="dark">Dark</button>
    </div>
  </div>

  <a class="mark mark--mail" href="mailto:frank.lvxa@gmail.com">frank.lvxa@gmail.com</a>
</div>

<script src="js/site.js"></script>
<script src="js/theme.js"></script>
<script src="js/node-tree.js"></script>
</body>
</html>
