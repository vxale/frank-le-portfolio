<!-- Only the colour mode lives up here now. The nameplate and the way
     back both came out on Sept 11 2026: the name is the root of the
     node tree one click away, and a masthead repeated on every page is
     the thing this site is built to avoid. Navigation is the cue in
     the lower right. -->
<header class="page-head">
  <div class="theme" role="group" aria-label="Colour mode">
    <button class="theme__btn" type="button" data-set-theme="light">Light</button>
    <button class="theme__btn" type="button" data-set-theme="dark">Dark</button>
  </div>
</header>

<!-- One template for every project, rebuilt as a scrolling canvas:
     the work leads, the writing follows quietly. Every frame is
     draggable and drifts on its own. js/work-detail.js fills it from
     data/works.json. -->
<main id="main" class="work-field">
  <p class="work-field__loading">Loading…</p>
</main>

</footer>

<!-- Navigation, lower right: the node tree's logic folded into one
     corner. Quiet until asked, then a short branch grows upward -
     Navigate, All works, Home - the way a node grows its children on
     the homepage. The trigger is first in the markup and the column is
     reversed in CSS, so the tab order runs bottom to top the way the
     branch reads. js/navcue.js owns the open state. -->
<nav class="navcue" data-cue aria-label="Site">
  <button class="navcue__trigger" type="button" aria-expanded="false">Navigate</button>
  <ul class="navcue__list">
    <li class="navcue__item"><button class="navcue__link" type="button" data-scroll-top>Back to top</button></li>
    <li class="navcue__item"><a class="navcue__link" href="contact.html">Contact</a></li>
    <li class="navcue__item"><a class="navcue__link" href="works.html">All works</a></li>
    <li class="navcue__item"><a class="navcue__link" href="index.html">Home</a></li>
  </ul>
</nav>
