<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Works — Frank Le</title>
<meta name="description" content="Films, commercials, and design work by Lê Vũ Xuân Anh (Frank Le), filterable by type, year, and commercial work.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
<script>try{var t=localStorage.getItem('theme');if(t==='dark'||t==='light')document.documentElement.dataset.theme=t;}catch(e){}</script>
</head>
<body data-nav-current="works">

<a class="skip-link" href="#main">Skip to content</a>

<!-- Only the colour mode lives up here now. The nameplate and the way
     back both came out on Sept 11 2026: the name is the root of the
     node tree one click away, and a masthead repeated on every page is
     the thing this site is built to avoid. Navigation is the cue in
     the lower right. -->
<header class="page-head">
  <div class="theme" role="group" aria-label="Colour mode">
    <button class="theme__btn" type="button" data-set-theme="light">Light</button>
    <button class="theme__btn" type="button" data-set-theme="dark">Dark</button>
  </div>
</header>

<main id="main">
  <section class="section">
    <div class="grid-12">
      <div class="section-head">
        <h1 class="label">Works — film, commercial, design</h1>
      </div>

      <div class="filters" role="group" aria-label="Filter works">
        <!-- filter buttons injected by js/works.js based on data/works.json -->
      </div>

      <p class="works-count" aria-live="polite"></p>

      <div class="works-grid">
        <!-- work cards injected by js/works.js -->
      </div>
    </div>
  </section>
</main>

<!-- The same end marks every other page closes on. The inverted slab
     that used to sit here was the last survivor of the pre-canvas
     design, and it is also a full-width dark field that the Navigate
     cue would have disappeared into. -->
<footer class="end-marks">
  <a class="end-marks__mail" href="mailto:frank.lvxa@gmail.com">frank.lvxa@gmail.com</a>
  <p class="label"><a href="https://www.linkedin.com/in/frank-lvxa/" target="_blank" rel="noopener">LinkedIn</a> &middot; &copy; 2026 Lê Vũ Xuân Anh</p>
</footer>

<!-- Navigation, lower right: the node tree's logic folded into one
     corner. Quiet until asked, then a short branch grows upward -
     Navigate, All works, Home - the way a node grows its children on
     the homepage. The trigger is first in the markup and the column is
     reversed in CSS, so the tab order runs bottom to top the way the
     branch reads. js/navcue.js owns the open state. -->
<nav class="navcue" aria-label="Site">
  <button class="navcue__trigger" type="button" aria-expanded="false">Navigate</button>
  <ul class="navcue__list">
    <li class="navcue__item"><a class="navcue__link" href="works.html">All works</a></li>
    <li class="navcue__item"><a class="navcue__link" href="index.html">Home</a></li>
  </ul>
</nav>

<script src="js/site.js"></script>
<script src="js/theme.js"></script>
<script src="js/navcue.js"></script>
<script src="js/works.js"></script>
</body>
</html>
